replicaCount: 2
image:
  repository: ghcr.io/obinna-obika-devops/platform-demo
  tag: "1.0.0"
  pullPolicy: IfNotPresent
serviceAccount:
  create: true
  name: platform-demo
  roleArn: ""
service:
  port: 8080
  metrics:
    enabled: true
    path: /metrics
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
autoscaling:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
