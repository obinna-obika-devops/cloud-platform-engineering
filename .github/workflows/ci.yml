name: Platform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3

      - uses: helm/kind-action@v1
        with:
          version: v0.25.0

      - name: Terraform format and validate
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

      - name: Helm lint
        run: helm lint charts/platform-service

      - name: Render and validate Kubernetes manifests
        run: |
          helm template platform-demo charts/platform-service > /tmp/platform-demo.yaml
          kubectl apply --dry-run=client --validate=false -f /tmp/platform-demo.yaml
          kubectl apply --dry-run=client --validate=false -f platform/tenancy.yaml

      - name: Build application image
        run: docker build -t platform-demo:${{ github.sha }} apps/platform-demo

      - name: Install application test dependencies
        run: python -m pip install -r apps/platform-demo/requirements.txt

      - name: Run application unit tests
        working-directory: apps/platform-demo
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
