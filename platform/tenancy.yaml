apiVersion: v1
kind: Namespace
metadata:
  name: team-platform
  labels: { platform.example.com/managed: "true" }
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: team-quota, namespace: team-platform }
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata: { name: defaults, namespace: team-platform }
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: workload-deployer, namespace: team-platform }
rules:
  - apiGroups: ["", "apps", "autoscaling"]
    resources: ["pods", "services", "deployments", "deployments/scale", "horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: workload-deployer, namespace: team-platform }
subjects: [{ kind: Group, name: platform-developers }]
roleRef: { kind: Role, name: workload-deployer, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: team-platform }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-dns-and-same-namespace, namespace: team-platform }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: [{ from: [{ podSelector: {} }] }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{ podSelector: {} }]
